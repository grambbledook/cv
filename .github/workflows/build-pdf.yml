name: Build CV PDFs

on:
  push:
    branches: [master]
    paths:
      - '**.tex'
      - '**.sty'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Make pdflatex embed a fixed date so rebuilds only differ when content does.
      SOURCE_DATE_EPOCH: '0'
      FORCE_SOURCE_DATE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Build PDFs
        run: |
          for tex in *.tex; do
            echo "::group::$tex"
            # Twice, so hyperref/toc references settle.
            pdflatex -interaction=nonstopmode -halt-on-error "$tex"
            pdflatex -interaction=nonstopmode -halt-on-error "$tex"
            echo "::endgroup::"
          done

      - name: Check cv-full.pdf links only where it claims to
        run: |
          python3 - <<'PY'
          import re, sys, zlib

          # Link targets live in annotation dictionaries, which pdflatex may
          # bury inside compressed object streams -- so inflate everything.
          data = open('cv-full.pdf', 'rb').read()
          uris = set(re.findall(rb'/URI\s*\((.*?)\)', data))
          for stream in re.finditer(rb'stream\r?\n(.*?)endstream', data, re.S):
              try:
                  uris |= set(re.findall(rb'/URI\s*\((.*?)\)',
                                         zlib.decompress(stream.group(1))))
              except zlib.error:
                  pass

          uris = sorted(u.decode('latin-1') for u in uris)
          print('cv-full.pdf link targets:')
          for u in uris:
              print(' ', u)

          expected = ('mailto:', 'https://linkedin.com/', 'https://github.com/')
          unexpected = [u for u in uris if not u.startswith(expected)]
          if unexpected or not any(u.startswith('https://linkedin.com/') for u in uris):
              sys.exit('cv-full.pdf must ship with real links only; got: %s'
                       % (unexpected or 'no LinkedIn link at all'))
          PY

      - name: Open PR if PDFs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- '*.pdf'; then
            echo 'PDFs are already up to date; nothing to do.'
            exit 0
          fi

          PR_BRANCH="automation/rebuild-pdfs-$(date -u +%Y%m%d-%H%M%S)"

          git checkout -b "$PR_BRANCH"
          git add -- '*.pdf'
          git commit -m "chore: rebuild PDFs from ${GITHUB_SHA::7}"
          git push origin "$PR_BRANCH"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$PR_BRANCH" \
            --title "chore: rebuild CV PDFs from ${GITHUB_SHA::7}" \
            --body "Regenerated from the \`.tex\` sources at ${GITHUB_SHA}."
